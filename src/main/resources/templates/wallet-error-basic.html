<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wallet Error</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f7f7f8;
            color: #1f2937;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .status {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 600;
            margin-bottom: 20px;
            background: #fee2e2;
            color: #991b1b;
        }

        .message-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            margin-top: 24px;
            margin-bottom: 24px;
        }

        .label {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .message {
            font-size: 16px;
            line-height: 1.5;
            word-break: break-word;
        }

        details {
            margin-top: 24px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 0;
            overflow: hidden;
        }

        summary {
            list-style: none;
            cursor: pointer;
            padding: 16px;
            font-weight: 600;
            background: #f3f4f6;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: "▾";
            float: right;
            color: #6b7280;
        }

        details[open] summary::after {
            content: "▴";
        }

        pre {
            margin: 0;
            padding: 16px;
            font-size: 13px;
            line-height: 1.5;
            background: #f9fafb;
            color: #111827;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .hint {
            margin-top: 20px;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="status">ERROR</div>

    <h1>Es ist ein Fehler aufgetreten</h1>
    <p>Der Vorgang konnte nicht erfolgreich abgeschlossen werden.</p>

    <div class="message-box">
        <div class="label">Fehlermeldung</div>
        <div class="message" th:text="${errorMessage}">Die Wallet-Registrierung konnte nicht verarbeitet werden.</div>
    </div>



</div>
</body>
</html>
