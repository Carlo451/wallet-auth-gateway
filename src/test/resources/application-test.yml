spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: wallet-auth-gateway
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  security:
    user:
      name: ${ADMIN_USER:user}
      password: ${ADMIN_USER:password}
      roles: ADMIN

gateway:
  api:
    controller-path: /test/wallet/api
    openId4vp:
      request-object-path: /test/openid4vp/request
      callback-path: /test/openid4vp/callback
  app:
    network:
      baseurl: https://camo-framework.gentoo-fiordland.ts.net:8443
  bridge:
    assertion:
      issuer: https://camo-framework.gentoo-fiordland.ts.net:8443
      registration-assertion-ttl-seconds: 60
      login-assertion-ttl-seconds: 30
    signing:
      key-id: gateway-signing-key-1
      type: JWT
      wallet-sign-priv-key: ${WALLET_SIGN_PRIVATE_KEY_PATH:}

server:
  port: ${SERVER_PORT:8443}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:}
    key-store: ${SERVER_SSL_KEY_STORE:}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:}
    key-alias: ${SERVER_SSL_KEY_ALIAS:}